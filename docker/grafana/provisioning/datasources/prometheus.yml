apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned UID: the provisioned dashboard panels reference datasource uid "prometheus".
    # Without this, Grafana assigns a random uid and every panel shows "No data".
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
